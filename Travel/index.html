    <div class="container">
        <p>
            <label for="select">事件：</label>
            <select id="selectEvent" class="selectpicker show-tick" data-live-search="true">
            </select>
            <label id="totalPrice"></label>
        </p>
        <p>
            <table id="testTable" class="table table-striped table-dark">
            </table>
        </p>
    </div>

    <script>
        $(function () {
            initEventSelecter();
            //initImages();
        });

        /*
         * 初始化图片轮播
         */
        function initImages() {
            for (var i = 1; i <= 25; i++) {
                if (i === 1) {
                    $('#carouselList').append("<li data-target='#carouselExampleIndicators' data-slide-to='" + (i - 1) + "' class='active'></li>");
                    $('#carouselImages').append("<div class='carousel-item active'> <img class='d-block w-100' src='Images/0404_" + i + ".jpg' alt='" + i + " slide'> </div>");
                } else {
                    $('#carouselList').append("<li data-target='#carouselExampleIndicators' data-slide-to='" + (i - 1) + "'></li>");
                    $('#carouselImages').append("<div class='carousel-item'> <img class='d-block w-100' src='Images/0404_" + i + ".jpg' alt='" + i + " slide'> </div>");
                }
            }
            $('.carousel').carousel();
        }

        /*
         * 初始化选择框
         */
        function initEventSelecter() {
            var selectEvent = $('#selectEvent');
            selectEvent.selectpicker({
                noneSelectedText: '请选择...'
            });
            selectEvent.selectpicker('mobile');
            selectEvent.on('changed.bs.select', function (e) {
                if (e.target.value) {
                    putData2Table(e.target.value);
                }
            });
            //读取本地json文件
            $.getJSON("events.json", function (data) {
                $.each(data, function (infoIndex, info) {
                    $opt = $("<option />", {
                        value: info["value"],
                        text: info["text"]
                    });
                    selectEvent.append($opt);
                })
                selectEvent.selectpicker('val', '');
                selectEvent.selectpicker('refresh');
            })
        }

        /*
         * 加载表数据
         */
        function putData2Table(val) {
            $("#testTable").bootstrapTable('destroy');
            var totalPrice = 0.0;
            $('#testTable').bootstrapTable({
                url: val + ".json",
                dataType: "json",
                columns: [{
                    field: 'number',
                    title: 'Number',
                    align: "center",
                    formatter: function (value, row, index) {
                        return index + 1;
                    }
                }, {
                    checkbox: true,
                    align: "center"
                }, {
                    field: 'name',
                    title: 'Name',
                    align: "center"
                }, {
                    field: 'price',
                    title: 'Price/RMB',
                    align: "right",
                    halign: "center",
                    formatter: function (value) {
                        if (value !== "") {
                            totalPrice += parseFloat(value);
                            $("#totalPrice").html("合计：" + totalPrice.toFixed(2));
                        }
                        return value;
                    }
                }, {
                    field: 'day',
                    title: 'Day',
                    align: "center"
                }, {
                    field: 'way',
                    title: 'Way',
                    align: "center"
                }]
            });
        }
    </script>
